<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理詰めで追い詰めるジェネレータ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 550px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
            font-size: 13px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #f5576c;
            border-bottom-color: #f5576c;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        input[type="text"], select, button {
            padding: 12px 16px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="text"] {
            font-weight: normal;
            cursor: text;
        }

        button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        select {
            background: white;
            color: #333;
        }

        select:focus, button:focus, input:focus {
            outline: none;
            border-color: #f5576c;
        }

        .excuse-display {
            background: #f8f8f8;
            border: 2px dashed #ddd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            min-height: 50px;
        }

        .result-box {
            background: #fff5f7;
            border-left: 4px solid #f5576c;
            padding: 20px;
            border-radius: 8px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 1.7;
            color: #333;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .copy-btn {
            width: 100%;
            margin-top: 15px;
            background: #f5576c;
        }

        .copy-btn:hover {
            background: #f4455a;
        }

        .difficulty-buttons {
            display: flex;
            gap: 10px;
        }

        .difficulty-buttons button {
            flex: 1;
            padding: 10px;
            font-size: 13px;
        }

        .empty-state {
            color: #999;
            font-style: italic;
            text-align: center;
        }

        .label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ 理詰めで追い詰める</h1>
        <p class="subtitle">言い訳を入力して、論理的な反論で相手を追い詰めよう</p>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(0)">ランダム反論</button>
            <button class="tab-btn" onclick="switchTab(1)">シナリオ反論</button>
            <button class="tab-btn" onclick="switchTab(2)">難易度反論</button>
        </div>

        <!-- Tab 1: ランダム反論 -->
        <div class="tab-content active">
            <div class="controls">
                <label class="label">言い訳を入力してください</label>
                <input type="text" id="randomExcuse" placeholder="例：実は私ロボットなんですよ">
                <button onclick="generateRandomCounterargument()">反論を生成</button>
            </div>
            <div class="excuse-display" id="randomExcuseDisplay" class="empty-state">
                ここに入力した言い訳が表示されます
            </div>
            <div class="result-box" id="randomResult" class="empty-state">
                ボタンをクリックして反論を生成しましょう
            </div>
            <button class="copy-btn" onclick="copyToClipboard('randomResult', event)">反論をコピー</button>
        </div>

        <!-- Tab 2: シナリオ反論 -->
        <div class="tab-content">
            <div class="controls">
                <label class="label">状況を選択してください</label>
                <select id="scenarioSelect" onchange="updateScenarioExcuse()">
                    <option value="">状況を選択</option>
                    <option value="late">遅刻した言い訳</option>
                    <option value="forgotten">締め切り忘れた言い訳</option>
                    <option value="absent">欠席した言い訳</option>
                    <option value="incomplete">未完成の言い訳</option>
                    <option value="mistake">ミスした言い訳</option>
                    <option value="tired">疲労の言い訳</option>
                </select>
                <button onclick="generateScenarioCounterargument()">反論を生成</button>
            </div>
            <div class="excuse-display" id="scenarioExcuseDisplay" class="empty-state">
                ここに言い訳が表示されます
            </div>
            <div class="result-box" id="scenarioResult" class="empty-state">
                状況を選択して反論を生成しましょう
            </div>
            <button class="copy-btn" onclick="copyToClipboard('scenarioResult', event)">反論をコピー</button>
        </div>

        <!-- Tab 3: 難易度反論 -->
        <div class="tab-content">
            <div class="controls">
                <label class="label">言い訳を入力してください</label>
                <input type="text" id="difficultyExcuse" placeholder="例：猫がキーボード踏んだ">
                <div class="difficulty-buttons">
                    <button onclick="generateByDifficulty('weak')">弱い反論</button>
                    <button onclick="generateByDifficulty('normal')">中程度</button>
                    <button onclick="generateByDifficulty('legend')">完璧な追い詰め</button>
                </div>
            </div>
            <div class="excuse-display" id="difficultyExcuseDisplay" class="empty-state">
                ここに入力した言い訳が表示されます
            </div>
            <div class="result-box" id="difficultyResult" class="empty-state">
                難易度を選択して反論を生成しましょう
            </div>
            <button class="copy-btn" onclick="copyToClipboard('difficultyResult', event)">反論をコピー</button>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadData().then(success => {
                if (!success) {
                    alert('データの読み込みに失敗しました');
                }
            });
        });

        function switchTab(index) {
            const contents = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-btn');

            contents.forEach(c => c.classList.remove('active'));
            buttons.forEach(b => b.classList.remove('active'));

            contents[index].classList.add('active');
            buttons[index].classList.add('active');
        }

        function generateRandomCounterargument() {
            if (!isDataReady()) {
                alert('データ読み込み中です。もう一度お試しください');
                return;
            }

            const random = excuses.random;
            if (!random || !random.reasons) return;

            const reason = random.reasons[Math.floor(Math.random() * random.reasons.length)];
            const cause = random.causes[Math.floor(Math.random() * random.causes.length)];
            const result = random.results[Math.floor(Math.random() * random.results.length)];
            const excuse = `${reason}${cause}、${result}`;

            let counterargument = counterarguments.random?.[reason];
            if (!counterargument && counterarguments.random) {
                const randomCounters = Object.values(counterarguments.random);
                counterargument = randomCounters[Math.floor(Math.random() * randomCounters.length)];
            }

            document.getElementById('randomExcuseDisplay').className = 'excuse-display';
            document.getElementById('randomExcuseDisplay').textContent = `「${excuse}」`;

            document.getElementById('randomResult').className = 'result-box';
            document.getElementById('randomResult').textContent = counterargument || 'データ読み込み中...';
        }

        function updateScenarioExcuse() {
            const scenario = document.getElementById('scenarioSelect').value;
            if (!scenario || !isDataReady() || !excuses.scenarios?.[scenario]) {
                document.getElementById('scenarioExcuseDisplay').className = 'excuse-display empty-state';
                document.getElementById('scenarioExcuseDisplay').textContent = 'ここに言い訳が表示されます';
                document.getElementById('scenarioResult').className = 'result-box empty-state';
                document.getElementById('scenarioResult').textContent = '状況を選択して反論を生成しましょう';
                return;
            }

            const excuseList = excuses.scenarios[scenario];
            if (!excuseList || !Array.isArray(excuseList)) return;

            const excuse = excuseList[Math.floor(Math.random() * excuseList.length)];
            document.getElementById('scenarioExcuseDisplay').className = 'excuse-display';
            document.getElementById('scenarioExcuseDisplay').textContent = `「${excuse}」`;
        }

        function generateScenarioCounterargument() {
            if (!isDataReady()) {
                alert('データ読み込み中です。もう一度お試しください');
                return;
            }

            const scenario = document.getElementById('scenarioSelect').value;
            if (!scenario) {
                alert('状況を選択してください');
                return;
            }

            const excuseList = excuses.scenarios?.[scenario];
            if (!excuseList || !Array.isArray(excuseList)) return;

            const excuse = excuseList[Math.floor(Math.random() * excuseList.length)];
            const counterargumentsForScenario = counterarguments.scenarios?.[scenario];
            let counterargument = counterargumentsForScenario?.[excuse];

            if (!counterargument && counterargumentsForScenario) {
                const countersList = Object.values(counterargumentsForScenario);
                counterargument = countersList[Math.floor(Math.random() * countersList.length)];
            }

            document.getElementById('scenarioExcuseDisplay').className = 'excuse-display';
            document.getElementById('scenarioExcuseDisplay').textContent = `「${excuse}」`;

            document.getElementById('scenarioResult').className = 'result-box';
            document.getElementById('scenarioResult').textContent = counterargument || 'データ読み込み中...';
        }

        function generateByDifficulty(difficulty) {
            if (!isDataReady()) {
                alert('データ読み込み中です。もう一度お試しください');
                return;
            }

            const input = document.getElementById('difficultyExcuse').value;
            if (!input.trim()) {
                alert('言い訳を入力してください');
                return;
            }

            const counterargumentList = counterarguments.difficulty?.[difficulty];
            if (!counterargumentList || !Array.isArray(counterargumentList)) return;

            const counterargument = counterargumentList[Math.floor(Math.random() * counterargumentList.length)];

            document.getElementById('difficultyExcuseDisplay').className = 'excuse-display';
            document.getElementById('difficultyExcuseDisplay').textContent = `「${input}」`;

            document.getElementById('difficultyResult').className = 'result-box';
            document.getElementById('difficultyResult').textContent = counterargument || 'データ読み込み中...';
        }

        function copyToClipboard(elementId, event) {
            const element = document.getElementById(elementId);
            const text = element.textContent;

            if (!text.trim() || text.includes('選択') || text.includes('生成') || text.includes('表示')) {
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                if (event && event.target) {
                    const btn = event.target;
                    const originalText = btn.textContent;
                    btn.textContent = 'コピーしました！';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                }
            });
        }
    </script>
</body>
</html>
