<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花火ゲーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #001a4d 0%, #0d0d2b 100%);
            cursor: crosshair;
            font-family: 'Arial', sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 8px;
            z-index: 10;
        }

        .info h2 {
            margin-bottom: 10px;
            color: #ffaa00;
            font-size: 18px;
        }

        .info p {
            margin: 5px 0;
        }

        .score {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 24px;
            color: #ffaa00;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 10;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="info">
        <h2>🎆 花火ゲーム</h2>
        <p>クリックして花火を打ち上げよう！</p>
        <p style="margin-top: 10px; color: #aaa;">スペース - ランダム花火</p>
    </div>

    <div class="score" id="score">花火: 0</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        let fireworkCount = 0;
        let rockets = [];

        const colors = [
            '#ff006e', '#0099ff', '#00ff88', '#d946ef', '#ffaa00',
            '#ff3366', '#00ccff', '#ff00cc', '#00ff66', '#ffff00',
            '#ff6600', '#00ffcc', '#ff1493', '#00bfff', '#32cd32'
        ];

        const colorSets = [
            ['#ff006e', '#ff1493', '#ffb6d9'],
            ['#0099ff', '#00ccff', '#87ceeb'],
            ['#ffaa00', '#ffc700', '#ffd700'],
            ['#d946ef', '#da70d6', '#ee82ee'],
            ['#00ff88', '#32cd32', '#90ee90'],
            ['#ff3366', '#ff6b9d', '#ffb3d9'],
        ];

        class Rocket {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.startX = x;
                this.startY = y;
                this.targetY = Math.random() * (canvas.height * 0.3) + canvas.height * 0.1;
                this.vy = Math.random() * 8 + 10;
                this.vx = (Math.random() - 0.5) * 2;
                this.alpha = 1;
                this.size = 3;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.trail = [];
                this.hasExploded = false;
            }

            update() {
                this.x += this.vx;
                this.y -= this.vy;
                this.vy -= 0.2; // 重力で減速

                this.trail.push({ x: this.x, y: this.y, alpha: 0.8 });
                if (this.trail.length > 20) this.trail.shift();

                if (this.y <= this.targetY && !this.hasExploded) {
                    this.explode();
                    this.hasExploded = true;
                }
            }

            explode() {
                const colorSet = colorSets[Math.floor(Math.random() * colorSets.length)];
                const particleCount = Math.random() * 120 + 120;

                for (let i = 0; i < particleCount; i++) {
                    const angle = (i / particleCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
                    const speed = Math.random() * 12 + 6;
                    const type = Math.random() > 0.75 ? 'star' : 'spark';
                    const color = colorSet[Math.floor(Math.random() * colorSet.length)];
                    particles.push(new Particle(this.x, this.y, color, type, speed, angle));
                }

                // 追加爆発
                if (Math.random() > 0.6) {
                    setTimeout(() => {
                        for (let i = 0; i < 60; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = Math.random() * 10 + 5;
                            const secondColor = colors[Math.floor(Math.random() * colors.length)];
                            particles.push(new Particle(this.x, this.y, secondColor, 'spark', speed, angle));
                        }
                    }, 150);
                }
            }

            draw() {
                // 軌跡を描画
                for (let i = 0; i < this.trail.length; i++) {
                    const t = this.trail[i];
                    ctx.globalAlpha = t.alpha * (i / this.trail.length) * 0.6;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.color;
                    ctx.fillRect(t.x, t.y, 2, 2);
                }

                // ロケット本体
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();

                ctx.globalAlpha = 1;
            }
        }

        class Particle {
            constructor(x, y, color, type = 'normal', speed = null, angle = null) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.type = type;
                this.size = Math.random() * 4 + 2;
                this.initialSize = this.size;

                // 速度と角度をカスタマイズ可能に
                if (angle === null) angle = Math.random() * Math.PI * 2;
                if (speed === null) speed = Math.random() * 10 + 4;

                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 1.5;

                this.alpha = 1;
                this.decay = Math.random() * 0.008 + 0.004;
                this.gravity = 0.15;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.3;
                this.air_resistance = 0.98;
                this.brightness = 1 + Math.random() * 0.3;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.alpha -= this.decay;
                this.vx *= this.air_resistance;
                this.rotation += this.rotationSpeed;
                this.size *= 0.98;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;

                // トレイル効果（より長く、より明るく）
                if (this.type === 'spark' || this.type === 'trail') {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.size * 2.5;
                    ctx.globalAlpha = this.alpha * 0.6;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(this.x - this.vx * 1.5, this.y - this.vy * 1.5);
                    ctx.lineTo(this.x, this.y);
                    ctx.stroke();
                }

                ctx.globalAlpha = this.alpha * this.brightness;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;

                if (this.type === 'star') {
                    this.drawStar(this.x, this.y, 5, this.size * 2, this.size * 0.8);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, Math.max(this.size, 0.5), 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            drawStar(x, y, points, outerRadius, innerRadius) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(this.rotation);
                ctx.beginPath();
                for (let i = 0; i < points * 2; i++) {
                    const radius = i % 2 === 0 ? outerRadius : innerRadius;
                    const angle = (i * Math.PI) / points;
                    const px = Math.cos(angle) * radius;
                    const py = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }


        function animate() {
            // シンプルな背景（残像効果）
            ctx.fillStyle = 'rgba(0, 26, 77, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 背景星を減らす（60個のみ）
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            for (let i = 0; i < 60; i++) {
                const x = (i * 317) % canvas.width;
                const y = (i * 431) % canvas.height;
                const brightness = Math.sin(i + Date.now() * 0.0002) * 0.3 + 0.6;
                ctx.globalAlpha = brightness * 0.6;
                ctx.fillRect(x, y, 1, 1);
            }

            ctx.globalAlpha = 1;

            // ロケットを更新・描画
            for (let i = rockets.length - 1; i >= 0; i--) {
                rockets[i].update();
                rockets[i].draw();

                if (rockets[i].hasExploded) {
                    rockets.splice(i, 1);
                }
            }

            // パーティクルを更新・描画
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        canvas.addEventListener('click', (e) => {
            rockets.push(new Rocket(e.clientX, canvas.height));
            fireworkCount++;
            document.getElementById('score').textContent = `花火: ${fireworkCount}`;
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                rockets.push(new Rocket(
                    Math.random() * canvas.width,
                    canvas.height
                ));
                fireworkCount++;
                document.getElementById('score').textContent = `花火: ${fireworkCount}`;
            }
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        animate();
    </script>
</body>
</html>
