<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポモドーロタイマー</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .timer-display {
            font-size: 80px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            letter-spacing: 5px;
        }

        .phase-info {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            height: 30px;
        }

        .phase-info.work {
            color: #ff6b6b;
        }

        .phase-info.break {
            color: #51cf66;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 100%;
            transition: width 0.5s linear;
        }

        .progress-fill.break {
            background: linear-gradient(90deg, #51cf66 0%, #40c057 100%);
        }

        .session-counter {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-start {
            background: #667eea;
            color: white;
        }

        .btn-start:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-start.running {
            background: #ff6b6b;
        }

        .btn-start.running:hover {
            background: #ff5252;
        }

        .btn-reset {
            background: #e0e0e0;
            color: #333;
        }

        .btn-reset:hover {
            background: #d0d0d0;
        }

        .stats {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 14px;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: bold;
            color: #333;
        }

        .tips {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 5px;
            font-size: 13px;
            color: #555;
            text-align: left;
        }

        .sound-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            font-size: 14px;
        }

        .sound-toggle input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .sound-toggle label {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍅 ポモドーロタイマー</h1>
        <p class="subtitle">集中力を高める時間管理ツール</p>

        <div class="timer-display" id="timerDisplay">25:00</div>

        <div class="phase-info work" id="phaseInfo">作業時間: 25分集中しましょう！</div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 100%;"></div>
        </div>

        <div class="session-counter" id="sessionCounter">
            セッション: 0 / 4
        </div>

        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="toggleTimer()">開始</button>
            <button class="btn-reset" onclick="resetTimer()">リセット</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">本日の作業時間</span>
                <span class="stat-value" id="totalWorkTime">0分</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">完成セッション</span>
                <span class="stat-value" id="completedSessions">0回</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">累積休憩時間</span>
                <span class="stat-value" id="totalBreakTime">0分</span>
            </div>
        </div>

        <div class="sound-toggle">
            <input type="checkbox" id="soundToggle" checked>
            <label for="soundToggle">完了時に音を鳴らす</label>
        </div>

        <div class="tips">
            💡 <strong>ポモドーロのコツ：</strong><br>
            • 作業中は通知をOFF<br>
            • 休憩中に軽く体を動かす<br>
            • 4セッション後は長めに休憩<br>
            • 1日8セッション（200分）が目安
        </div>
    </div>

    <script>
        const WORK_TIME = 25 * 60;
        const SHORT_BREAK = 5 * 60;
        const LONG_BREAK = 15 * 60;

        let state = {
            isRunning: false,
            isWorkPhase: true,
            timeLeft: WORK_TIME,
            totalTime: WORK_TIME,
            sessionCount: 0,
            completedSessions: 0,
            totalWorkTime: 0,
            totalBreakTime: 0,
            intervalId: null
        };

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateDisplay() {
            document.getElementById('timerDisplay').textContent = formatTime(state.timeLeft);

            const progress = (state.timeLeft / state.totalTime) * 100;
            const progressFill = document.getElementById('progressFill');
            progressFill.style.width = progress + '%';

            if (state.isWorkPhase) {
                progressFill.className = 'progress-fill';
            } else {
                progressFill.className = 'progress-fill break';
            }

            updateStats();
        }

        function updatePhaseInfo() {
            const phaseInfo = document.getElementById('phaseInfo');
            const sessionCounter = document.getElementById('sessionCounter');

            if (state.isWorkPhase) {
                phaseInfo.textContent = '作業時間: 25分集中しましょう！';
                phaseInfo.className = 'phase-info work';
                sessionCounter.textContent = `セッション: ${state.sessionCount} / 4`;
            } else {
                const isLongBreak = (state.sessionCount % 4 === 0);
                const breakTime = isLongBreak ? 15 : 5;
                phaseInfo.textContent = isLongBreak ?
                    `長休憩: ${breakTime}分ゆっくり休みましょう！` :
                    `短休憩: ${breakTime}分軽く休みましょう！`;
                phaseInfo.className = 'phase-info break';
            }
        }

        function updateStats() {
            document.getElementById('totalWorkTime').textContent =
                Math.floor(state.totalWorkTime / 60) + '分';
            document.getElementById('completedSessions').textContent =
                state.completedSessions + '回';
            document.getElementById('totalBreakTime').textContent =
                Math.floor(state.totalBreakTime / 60) + '分';
        }

        function playSound() {
            if (!document.getElementById('soundToggle').checked) return;

            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function switchPhase() {
            if (state.isWorkPhase) {
                // 作業終了 → 休憩開始
                state.totalWorkTime += WORK_TIME;
                state.completedSessions++;
                state.isWorkPhase = false;
                const isLongBreak = (state.sessionCount % 4 === 0);
                state.totalTime = isLongBreak ? LONG_BREAK : SHORT_BREAK;
                state.timeLeft = state.totalTime;
                playSound();
            } else {
                // 休憩終了 → 作業開始
                state.totalBreakTime += state.totalTime;
                state.isWorkPhase = true;
                state.sessionCount++;
                state.totalTime = WORK_TIME;
                state.timeLeft = state.totalTime;
                playSound();
            }

            updatePhaseInfo();
            updateDisplay();

            // 自動継続
            if (state.sessionCount < 8) {
                setTimeout(() => {
                    if (!state.isRunning) startTimer();
                }, 2000);
            } else {
                stopTimer();
                alert('本日のポモドーロ完了！お疲れ様でした！');
            }
        }

        function tick() {
            state.timeLeft--;
            updateDisplay();

            if (state.timeLeft <= 0) {
                switchPhase();
            }
        }

        function startTimer() {
            if (state.isRunning) return;
            state.isRunning = true;
            document.getElementById('startBtn').textContent = '一時停止';
            document.getElementById('startBtn').classList.add('running');

            state.intervalId = setInterval(tick, 1000);
        }

        function stopTimer() {
            state.isRunning = false;
            document.getElementById('startBtn').textContent = '開始';
            document.getElementById('startBtn').classList.remove('running');
            clearInterval(state.intervalId);
        }

        function toggleTimer() {
            if (state.isRunning) {
                stopTimer();
            } else {
                startTimer();
            }
        }

        function resetTimer() {
            stopTimer();
            state.isWorkPhase = true;
            state.sessionCount = 0;
            state.completedSessions = 0;
            state.totalWorkTime = 0;
            state.totalBreakTime = 0;
            state.timeLeft = WORK_TIME;
            state.totalTime = WORK_TIME;
            updatePhaseInfo();
            updateDisplay();
        }

        // 初期表示
        updatePhaseInfo();
        updateDisplay();
    </script>
</body>
</html>
