            font-size: 14px;
            font-weight: bold;

            background: #667eea;
            color: white;
        }

            background: #667eea;
            color: white;
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);

            font-size: 24px;
            margin-bottom: 20px;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .genre-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .genre-card {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .genre-card:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.8);
            transform: translateY(-5px);
        }

        .genre-name {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .genre-description {
            font-size: 13px;
            color: #bbb;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .ranking-list {
            font-size: 12px;
            color: #999;
            margin-bottom: 15px;
        }

        .ranking-item {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ranking-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .ranking-number {
            color: #667eea;
            font-weight: bold;
            font-size: 14px;
        }

        .song-title {
            color: #ddd;
            font-weight: bold;
            margin: 5px 0;
        }

        .artist-name {
            color: #aaa;
            font-size: 11px;
            margin-bottom: 8px;
        }

        .music-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .music-link {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(102, 126, 234, 0.3);
            color: #667eea;
            text-decoration: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .music-link:hover {
            background: rgba(102, 126, 234, 0.6);
            color: white;
        }

        .tag {
            display: inline-block;
            background: rgba(102, 126, 234, 0.3);
            color: #667eea;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 11px;
            margin: 3px 3px 3px 0;
        }

        .emoji {
            font-size: 1.2em;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
            }

            .genre-grid {
                grid-template-columns: 1fr;
            }

            .music-links {
                flex-direction: column;
            }

            .music-link {
                display: block;
                text-align: center;
            }

                    { rank: 2, title: "Super Shy", artist: "NewJeans", year: "2023", chart: "Global #15", spotify: "https://open.spotify.com/search/NewJeans%20Super%20Shy", youtube: "https://www.youtube.com/results?search_query=NewJeans", apple: "https://music.apple.com/search?term=NewJeans" },
                    { rank: 3, title: "FEARLESS", artist: "LE SSERAFIM", year: "2023", chart: "Global Top 20", spotify: "https://open.spotify.com/search/LE%20SSERAFIM%20FEARLESS", youtube: "https://www.youtube.com/results?search_query=LE+SSERAFIM", apple: "https://music.apple.com/search?term=LE+SSERAFIM" }
                ]
            },
            "🇯🇵 日本": {
                trend: "J-POP & City Pop",
                songs: [
                    { rank: 1, title: "Plastic Love", artist: "Mariya Takeuchi", year: "2024", chart: "City Pop Top", spotify: "https://open.spotify.com/search/Mariya%20Takeuchi", youtube: "https://www.youtube.com/results?search_query=Mariya+Takeuchi", apple: "https://music.apple.com/search?term=Mariya+Takeuchi" },
                    { rank: 2, title: "Noriega", artist: "Official髭男dism", year: "2024", chart: "Japan Top 10", spotify: "https://open.spotify.com/search/Official%20Hige%20Dandism", youtube: "https://www.youtube.com/results?search_query=Official+Hige+Dandism", apple: "https://music.apple.com/search?term=Official+Hige+Dandism" },
                    { rank: 3, title: "Ride on Time", artist: "Tatsuro Yamashita", year: "2024", chart: "Timeless", spotify: "https://open.spotify.com/search/Tatsuro%20Yamashita", youtube: "https://www.youtube.com/results?search_query=Tatsuro+Yamashita", apple: "https://music.apple.com/search?term=Tatsuro+Yamashita" }
                ]
            }
        };


        function renderGenres() {
            const grid = document.getElementById('genreGrid');
            grid.innerHTML = genreData.map(genre => `
                <div class="genre-card">
                    <div class="genre-name">${genre.emoji} ${genre.name}</div>
                    <div class="genre-description">${genre.description}</div>
                    <div class="ranking-list">
                        <strong>🔥 人気曲TOP 3:</strong>
                        ${genre.songs.map(song => `
                            <div class="ranking-item">
                                <div class="ranking-number">#${song.rank} ${song.title}</div>
                                <div class="artist-name">${song.artist}</div>
                                <div class="music-links">
                                    <a href="${song.spotify}" target="_blank" class="music-link">🎵 Spotify</a>
                                    <a href="${song.youtube}" target="_blank" class="music-link">▶️ YouTube</a>
                                    <a href="${song.apple}" target="_blank" class="music-link">🎧 Apple Music</a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div style="margin-top: 15px;">
                        <span class="tag">${genre.trend}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderCountries() {
            const grid = document.getElementById('countryGrid');
            grid.innerHTML = Object.entries(countryData).map(([country, data]) => `
                <div class="genre-card">
                    <div class="genre-name">${country}</div>
                    <div class="genre-description">トレンド: ${data.trend}</div>
                    <div class="ranking-list">
                        <strong>🔥 人気曲TOP 3:</strong>
                        ${data.songs.map(song => `
                            <div class="ranking-item">
                                <div class="ranking-number">#${song.rank} ${song.title}</div>
                                <div class="artist-name">${song.artist}</div>
                                <div class="music-links">
                                    <a href="${song.spotify}" target="_blank" class="music-link">🎵 Spotify</a>
                                    <a href="${song.youtube}" target="_blank" class="music-link">▶️ YouTube</a>
                                    <a href="${song.apple}" target="_blank" class="music-link">🎧 Apple Music</a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function filterSection(type) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const sections = ['genre-section', 'country-section'];

            if (type === 'all') {
                sections.forEach(s => document.getElementById(s).classList.remove('hidden'));
            } else {
                sections.forEach(s => {
                    const sectionType = s.split('-')[0];
                    if (sectionType === type) {
                        document.getElementById(s).classList.remove('hidden');
                    } else {
                        document.getElementById(s).classList.add('hidden');
                    }
                });
            }
        }

        // 初期表示
        renderGenres();
        renderCountries();
    </script>
</body>
</html>
