<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコード生成ツール</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }

        input[type="text"]::placeholder {
            color: #bbb;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
        }

        .option-item {
            display: flex;
            flex-direction: column;
        }

        .option-item label {
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="number"],
        input[type="color"],
        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        input[type="color"] {
            width: 100%;
            height: 45px;
            cursor: pointer;
        }

        select {
            cursor: pointer;
        }

        .qr-display {
            text-align: center;
            background: #f9f9f9;
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 30px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #qrcode {
            display: inline-block;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .qr-empty {
            color: #999;
            font-size: 14px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            grid-column: 1 / 3;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-download:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-copy {
            background: #51cf66;
            color: white;
        }

        .btn-copy:hover {
            background: #40c057;
            transform: translateY(-2px);
        }

        .btn-copy:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-clear {
            background: #e0e0e0;
            color: #333;
        }

        .btn-clear:hover {
            background: #d0d0d0;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
            margin-top: 20px;
        }

        .info-box strong {
            color: #333;
        }

        .copy-feedback {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #51cf66;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .copy-feedback.show {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .btn-download {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 QRコード生成</h1>
        <p class="subtitle">URLやテキストからQRコードを自動生成</p>

        <div class="input-section">
            <label for="urlInput">URLまたはテキスト</label>
            <input
                type="text"
                id="urlInput"
                placeholder="https://example.com または 任意のテキスト"
                oninput="generateQR()"
            >
        </div>

        <div class="options">
            <div class="option-item">
                <label for="sizeInput">サイズ (px)</label>
                <input
                    type="number"
                    id="sizeInput"
                    value="200"
                    min="100"
                    max="500"
                    step="50"
                    onchange="generateQR()"
                >
            </div>

            <div class="option-item">
                <label for="errorLevel">誤り訂正レベル</label>
                <select id="errorLevel" onchange="generateQR()">
                    <option value="L">L (7%)</option>
                    <option value="M" selected>M (15%)</option>
                    <option value="Q">Q (25%)</option>
                    <option value="H">H (30%)</option>
                </select>
            </div>

            <div class="option-item">
                <label for="darkColor">暗い色</label>
                <input
                    type="color"
                    id="darkColor"
                    value="#000000"
                    onchange="generateQR()"
                >
            </div>

            <div class="option-item">
                <label for="lightColor">明るい色</label>
                <input
                    type="color"
                    id="lightColor"
                    value="#ffffff"
                    onchange="generateQR()"
                >
            </div>
        </div>

        <div class="qr-display">
            <div id="qrcode" class="qr-empty">
                テキストを入力するとQRコードが表示されます
            </div>
        </div>

        <div class="controls">
            <button class="btn-copy" id="copyBtn" onclick="copyQRImage()" disabled>
                📋 コピー
            </button>
            <button class="btn-clear" onclick="clearInput()">🗑️ クリア</button>
            <button class="btn-download" id="downloadBtn" onclick="downloadQR()" disabled>
                ⬇️ ダウンロード (PNG)
            </button>
        </div>

        <div class="info-box">
            <strong>💡 ヒント：</strong><br>
            • 誤り訂正レベルが高いほど、部分的な破損に耐性があります<br>
            • 色を変更してデザインに合わせることができます<br>
            • 生成したQRコードは自由に使用できます
        </div>
    </div>

    <div class="copy-feedback" id="copyFeedback">✓ コピーしました！</div>

    <script>
        let qrInstance = null;

        function generateQR() {
            const input = document.getElementById('urlInput').value.trim();
            const qrDiv = document.getElementById('qrcode');
            const copyBtn = document.getElementById('copyBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!input) {
                qrDiv.innerHTML = '';
                qrDiv.className = 'qr-empty';
                qrDiv.textContent = 'テキストを入力するとQRコードが表示されます';
                copyBtn.disabled = true;
                downloadBtn.disabled = true;
                return;
            }

            // 前のQRコードをクリア
            qrDiv.innerHTML = '';
            qrDiv.className = '';

            const size = parseInt(document.getElementById('sizeInput').value);
            const errorLevel = document.getElementById('errorLevel').value;
            const darkColor = document.getElementById('darkColor').value;
            const lightColor = document.getElementById('lightColor').value;

            qrInstance = new QRCode(document.getElementById('qrcode'), {
                text: input,
                width: size,
                height: size,
                colorDark: darkColor,
                colorLight: lightColor,
                correctLevel: QRCode.CorrectLevel[errorLevel]
            });

            copyBtn.disabled = false;
            downloadBtn.disabled = false;
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) return;

            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `qrcode_${Date.now()}.png`;
            link.click();
        }

        function copyQRImage() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) return;

            canvas.toBlob((blob) => {
                const item = new ClipboardItem({ 'image/png': blob });
                navigator.clipboard.write([item]).then(() => {
                    showCopyFeedback();
                }).catch(err => {
                    alert('コピーに失敗しました');
                });
            });
        }

        function showCopyFeedback() {
            const feedback = document.getElementById('copyFeedback');
            feedback.classList.add('show');
            setTimeout(() => {
                feedback.classList.remove('show');
            }, 2000);
        }

        function clearInput() {
            document.getElementById('urlInput').value = '';
            document.getElementById('qrcode').innerHTML = '';
            document.getElementById('qrcode').className = 'qr-empty';
            document.getElementById('qrcode').textContent = 'テキストを入力するとQRコードが表示されます';
            document.getElementById('copyBtn').disabled = true;
            document.getElementById('downloadBtn').disabled = true;
        }

        // Enterキーで生成
        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') generateQR();
        });
    </script>
</body>
</html>
