<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パーティクルペイント</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial', sans-serif;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 8px;
            z-index: 10;
        }

        .info h2 {
            margin-bottom: 10px;
            color: #0ff;
        }

        .info p {
            margin: 5px 0;
        }

        .info .key {
            color: #0f0;
            font-weight: bold;
        }

        .color-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 20px currentColor;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="info">
        <h2>✨ パーティクルペイント</h2>
        <p>マウスを動かして描画</p>
        <p>キーボードで色変更:</p>
        <p><span class="key">1</span> - 赤</p>
        <p><span class="key">2</span> - 青</p>
        <p><span class="key">3</span> - 緑</p>
        <p><span class="key">4</span> - 紫</p>
        <p><span class="key">5</span> - 黄</p>
        <p><span class="key">R</span> - リセット</p>
    </div>

    <div class="color-indicator" id="colorIndicator"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const colors = {
            1: '#ff006e',
            2: '#0099ff',
            3: '#00ff88',
            4: '#d946ef',
            5: '#ffaa00'
        };

        let currentColor = '#0099ff';
        let mouseX = 0;
        let mouseY = 0;
        let isMoving = false;

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 8 + 3;
                this.speedX = (Math.random() - 0.5) * 4;
                this.speedY = (Math.random() - 0.5) * 4 - 2;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += 0.1;
                this.alpha -= this.decay;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.lineTo(this.size, this.size);
                ctx.lineTo(-this.size, this.size);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        function createParticles(x, y, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, currentColor));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(26, 26, 46, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            createParticles(mouseX, mouseY, 6);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key in colors) {
                currentColor = colors[e.key];
                document.getElementById('colorIndicator').style.color = currentColor;
            }
            if (e.key.toLowerCase() === 'r') {
                particles.length = 0;
            }
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        document.getElementById('colorIndicator').style.color = currentColor;
        animate();
    </script>
</body>
</html>
