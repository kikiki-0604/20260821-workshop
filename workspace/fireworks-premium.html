<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隅田川花火大会 - 豪華版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(ellipse at center, #0a1a3a 0%, #050a1a 100%);
            cursor: crosshair;
            font-family: 'Arial', sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 30px rgba(255,200,100,0.1));
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            z-index: 10;
            border: 2px solid #ffaa00;
        }

        .info h2 {
            margin-bottom: 10px;
            color: #ffdd00;
            font-size: 20px;
            text-shadow: 0 0 10px #ffaa00;
        }

        .info p {
            margin: 5px 0;
        }

        .stats {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 16px;
            color: #ffdd00;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 10;
            border: 2px solid #ffaa00;
            text-shadow: 0 0 10px #ffaa00;
        }

        .particle-count {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="info">
        <h2>🎆 隅田川花火大会</h2>
        <p>クリックで大型花火を打ち上げ</p>
        <p style="margin-top: 10px; color: #aaa;">
            <span style="color: #ffaa00;">Space</span> - ランダム連発<br>
            <span style="color: #ffaa00;">R</span> - リセット
        </p>
    </div>

    <div class="stats">
        <div>🎆 花火: <span id="count">0</span></div>
        <div class="particle-count">パーティクル: <span id="particles">0</span></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        let fireworkCount = 0;

        const colorSchemes = [
            // 伝統的な赤
            { main: '#ff1a1a', secondary: '#ffaa00', glow: '#ff6600' },
            // 江戸紫
            { main: '#d946ef', secondary: '#ff00ff', glow: '#9933ff' },
            // 金色
            { main: '#ffdd00', secondary: '#ffaa00', glow: '#ffff00' },
            // 青紫
            { main: '#0099ff', secondary: '#00ffff', glow: '#0066ff' },
            // 緑
            { main: '#00ff99', secondary: '#00ffcc', glow: '#00ff66' },
            // ピンク白
            { main: '#ffccff', secondary: '#ffffff', glow: '#ff99ff' },
            // 赤白
            { main: '#ff3366', secondary: '#ffffff', glow: '#ff0066' }
        ];

        class Particle {
            constructor(x, y, color, type = 'normal', speed = 1) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.type = type;
                this.size = Math.random() * 3 + 1;

                const angle = Math.random() * Math.PI * 2;
                const baseSpeed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * baseSpeed * speed;
                this.vy = Math.sin(angle) * baseSpeed * speed - 1;

                this.alpha = 1;
                this.decay = Math.random() * 0.008 + 0.004;
                this.gravity = 0.1;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.3;

                // 軌跡用
                this.trail = [];
                this.trailLength = 8;
            }

            update() {
                // 軌跡に現在位置を追加
                this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }

                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.alpha -= this.decay;
                this.vx *= 0.98;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();

                // 軌跡を描画
                if (this.trail.length > 1) {
                    for (let i = 0; i < this.trail.length; i++) {
                        const t = this.trail[i];
                        const trailAlpha = (i / this.trail.length) * this.alpha * 0.3;
                        ctx.globalAlpha = trailAlpha;
                        ctx.fillStyle = this.color;
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = this.color;
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, this.size * 0.6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // メインパーティクル
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 30;
                ctx.shadowColor = this.color;

                if (this.type === 'star') {
                    this.drawStar(this.x, this.y, 5, this.size * 2, this.size * 0.8);
                } else if (this.type === 'ring') {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.size * 0.5;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            drawStar(x, y, points, outerRadius, innerRadius) {
                ctx.translate(x, y);
                ctx.rotate(this.rotation);
                ctx.beginPath();
                for (let i = 0; i < points * 2; i++) {
                    const radius = i % 2 === 0 ? outerRadius : innerRadius;
                    const angle = (i * Math.PI) / points;
                    const px = Math.cos(angle) * radius;
                    const py = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
            }
        }

        class Firework {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.scheme = colorSchemes[Math.floor(Math.random() * colorSchemes.length)];
                this.age = 0;
                this.maxAge = 60;
            }

            create() {
                const types = ['normal', 'star', 'ring'];
                const type = types[Math.floor(Math.random() * types.length)];

                // メインカラー爆発
                const mainCount = Math.random() * 150 + 200;
                for (let i = 0; i < mainCount; i++) {
                    particles.push(
                        new Particle(this.x, this.y, this.scheme.main, type, 1)
                    );
                }

                // セカンダリーカラー爆発
                const secondCount = Math.random() * 80 + 100;
                for (let i = 0; i < secondCount; i++) {
                    particles.push(
                        new Particle(
                            this.x + (Math.random() - 0.5) * 30,
                            this.y + (Math.random() - 0.5) * 30,
                            this.scheme.secondary,
                            type,
                            0.8
                        )
                    );
                }

                // グロー効果
                for (let i = 0; i < 40; i++) {
                    particles.push(
                        new Particle(this.x, this.y, this.scheme.glow, 'ring', 0.5)
                    );
                }

                // 二次爆発（遅延）
                setTimeout(() => {
                    if (this.alive) {
                        const subCount = Math.random() * 80 + 50;
                        for (let i = 0; i < subCount; i++) {
                            particles.push(
                                new Particle(this.x, this.y, this.scheme.secondary, 'normal', 0.6)
                            );
                        }
                    }
                }, 300);

                this.alive = true;
            }
        }

        function createFirework(x, y) {
            const fw = new Firework(x, y);
            fw.create();
            fireworkCount++;
            document.getElementById('count').textContent = fireworkCount;
            playSound();
        }

        function playSound() {
            // シンプルなビープ音
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc.connect(gain);
            gain.connect(audioContext.destination);

            gain.gain.setValueAtTime(0.1, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

            osc.frequency.setValueAtTime(100 + Math.random() * 200, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioContext.currentTime + 0.3);

            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.3);
        }

        function animate() {
            // 背景を暗く保つ（非常に長い残像効果）
            ctx.fillStyle = 'rgba(5, 10, 26, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 夜空の星をたくさん描く
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            for (let i = 0; i < 150; i++) {
                const x = (i * 127 + i * i * 7) % canvas.width;
                const y = (i * 89 + i * i * 3) % canvas.height;
                const brightness = Math.sin(i + Date.now() * 0.0002) * 0.3 + 0.7;
                ctx.globalAlpha = brightness * 0.8;
                const size = Math.sin(i * 0.5) * 0.5 + 1;
                ctx.fillRect(x, y, size, size);
            }

            ctx.globalAlpha = 1;

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            document.getElementById('particles').textContent = particles.length;
            requestAnimationFrame(animate);
        }

        canvas.addEventListener('click', (e) => {
            createFirework(e.clientX, e.clientY);
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                // ランダム連発
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        createFirework(
                            Math.random() * canvas.width * 0.6 + canvas.width * 0.2,
                            Math.random() * (canvas.height * 0.4) + canvas.height * 0.1
                        );
                    }, i * 300);
                }
            }
            if (e.key.toLowerCase() === 'r') {
                particles.length = 0;
                fireworkCount = 0;
                document.getElementById('count').textContent = 0;
            }
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        animate();
    </script>
</body>
</html>
